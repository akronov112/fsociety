name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Check tkinter is available
        run: python -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name my_app --hidden-import tkinter --collect-all tkinter rb_ch.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: my_app-windows
          path: dist/my_app.exe
