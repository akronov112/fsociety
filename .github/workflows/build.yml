name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show all files (отладка)
        run: gci -Recurse | % FullName

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name my_app main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: my_app-windows
          path: dist/my_app.exe
